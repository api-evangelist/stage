aid: stage
name: Stage
description: >-
  Stage is a code review tool that reorganizes local git changes and pull
  requests into logical, ordered "chapters" so engineers can review and merge
  changes far faster — a workflow built for teams shipping large volumes of
  AI-generated code. Stage ships an open-source (MIT) command-line tool,
  "stagereview", that runs entirely on the developer's machine and works with
  any AI coding agent (Claude Code, Cursor, Codex, Gemini, opencode): it diffs
  the current branch or a GitHub PR, clusters the hunks into narrated chapters
  with a prologue, and opens them in a local browser SPA for review. The full
  hosted Stage experience lives at stagereview.app. Stage is a Y Combinator
  (Spring 2026) company founded by Charles Pan and Dean Stratakos.
